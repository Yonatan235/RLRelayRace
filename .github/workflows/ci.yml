name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Smoke test
        run: |
          python - <<'PY'
from rlrelayrace import RLRelayRaceEnvContest, ContestEnvConfig
env = RLRelayRaceEnvContest(ContestEnvConfig(M=3, track_length=300, max_steps=200, exchange_zone_width=0.1, seed=0))
obs, info = env.reset()
for _ in range(60):
    a = env.action_space.sample()
    obs, r, term, trunc, info = env.step(a)
print("ok")
PY
